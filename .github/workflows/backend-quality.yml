name: backend-quality

on:
  push:
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quality_test
          POSTGRES_USER: quality_test
          POSTGRES_PASSWORD: quality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quality_test -d quality_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/quality_test
      TEST_DATABASE_USERNAME: quality_test
      TEST_DATABASE_PASSWORD: quality_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend contracts and quality gates
        run: mvn --batch-mode --no-transfer-progress verify
