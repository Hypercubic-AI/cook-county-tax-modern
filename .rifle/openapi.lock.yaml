openapi: 3.1.0
info:
  title: EIFD/TIF Increment Batch API
  version: 1.0.0
  description: |
    Starts and observes the nine-step EIFD/TIF increment batch. The service uses
    preloaded shared-live assessment, tax-code, agency-reference, frozen-valuation,
    and agency-equalized-valuation data. Requests never identify local files.
    Every launch pins the business clock for the complete chain. Runs share the
    live indexed stores and are not isolated snapshots.
servers:
- url: http://localhost:8080
  description: Local development
tags:
- name: EifdTifIncrementRuns
  description: Asynchronous EIFD/TIF increment batch runs.
security: []
paths:
  /api/assessed-value-preparation-runs:
    post:
      tags:
      - Assessed Value Preparation Runs
      summary: Start an assessed value preparation run
      operationId: startAssessedValuePreparationRun
      description: |
        Creates an asynchronous run over the assessment data already preloaded
        on the server. The supplied business date and time are pinned for every
        stage, and `processYear` supplies the evidenced two-character ASREA178
        parameter. The accepted business rules below all apply at this endpoint.
        Their final batch outcome, counts, outputs, and messages are observed by
        reading the returned resource through
        `GET /api/assessed-value-preparation-runs/{id}`.

        Failure and partial-output semantics are explicit. A descending key in
        overall-class preparation produces a `FAILED` run, return code 16, an
        `asrea018-001` error message, and `partialOutput: true` when records were
        published. A descending key in valuation bucketing also produces a
        `FAILED` run and `partialOutput: true`, even though the legacy stage can
        report return code zero; its message names `asrea151-001`. Outputs made
        before either failure remain listed with `partial: true` and are never
        represented as a clean successful result. Source defects such as invalid
        decimal selectors, major-9 switch contamination, and nonpositive Type-5
        occupancy are likewise surfaced in rule-addressed messages.
      x-business-rules:
      - id: asrea003-001
        behavior: Value one supplied supported land or improvement detail without independently reading or publishing a batch dataset.
      - id: asrea003-002
        behavior: Zero EX/RR land; otherwise apply supported decimal scaling, unit price, positive adjustment factors, and the one-dollar minimum.
      - id: asrea003-003
        behavior: Preserve the observed one-dollar result for decimal selectors 6 through 9 and emit a defect message naming this rule.
      - id: asrea003-004
        behavior: Value Type-2 area improvements from scaled area, unit price, condition, optional positive assessed percentage, and the one-dollar minimum.
      - id: asrea003-005
        behavior: Apply class-288 reproduction-cost relief using the accepted year bands and thresholds.
      - id: asrea003-006
        behavior: Start Type-3 valuation from reproduction cost; start Type-4/5 only for positive condition, while preserving the documented zero and one-dollar boundaries.
      - id: asrea018-001
        behavior: Require nondecreasing township, volume, parcel, and tax-type order and expose failed partial publication explicitly.
      - id: asrea018-002
        behavior: Use the highest land class for land-only parcels and report parcels that contain no land detail.
      - id: asrea018-003
        behavior: Resolve named improvement classes by the fixed first-match major-class precedence.
      - id: asrea018-004
        behavior: Resolve other recognized improvement classes by major class, tier priority, valuation, and minor class, neutralizing minor class 88.
      - id: asrea018-005
        behavior: Preserve the prior overall class and report the record when improvement classification cannot be resolved.
      - id: asrea018-006
        behavior: Exclude attached questionnaire occurrences from overall-class selection.
      - id: asrea018-007
        behavior: Identify observed major-9 tier-2 contamination of the major-8 switch as a reported source defect, not an endorsed classification policy.
      - id: asrea151-001
        behavior: Require nondecreasing township, volume, and parcel order and expose the legacy zero-return-code partial output as a failed run.
      - id: asrea151-002
        behavior: Map overall Assessor class through the 242-entry table; report nonzero misses and use the accepted major-digit fallback.
      - id: asrea151-003
        behavior: Establish parcel bucket eligibility using class-239/class-200 land and the strict residential and class-299 value thresholds.
      - id: asrea151-004
        behavior: Accumulate class-239 land and class-224 improvements into farm value when class-239 land is present.
      - id: asrea151-005
        behavior: Accumulate eligible major-class-2 non-farm detail into homeowner value and all remaining detail into non-homeowner value.
      - id: asrea151-006
        behavior: Publish three distinct report buckets while persisting farm separately, homeowner plus non-homeowner combined, and the documented cleared slots.
      - id: asrea151-007
        behavior: Exclude questionnaire occurrences from both valuation-bucket passes.
      - id: asrea178-001
        behavior: Require a numeric two-character process year and use the accepted pivot only for report-century display.
      - id: asrea178-002
        behavior: Clear Type-2 CDU year and exclude attached questionnaires from conversion scanning.
      - id: asrea178-003
        behavior: Report nonpositive Type-5 occupancy as a source defect while recording the observed conversion without cost gross-up.
      - id: asrea178-004
        behavior: Normalize positive-occupancy Type-5 reproduction cost and map the detail to Type 3, code 2, and year zero.
      - id: asrea178-005
        behavior: Revalue every non-questionnaire detail under ASREA003 policy when any Type-5 detail is found.
      - id: asrea178-006
        behavior: Separate recomputed proposed land and improvement totals by detail type while skipping questionnaires.
      - id: asrea178-007
        behavior: Archive the prior proposed total in slot 12 and replace proposed land, improvement, and total values.
      - id: asrea178-008
        behavior: Do not apply the unreachable legacy township lookup as an active validation guard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessedValuePreparationRunRequest'
            examples:
              standardRun:
                value:
                  businessDate: 2025-09-15
                  businessTime: 12:00:00
                  idempotencyKey: avp-2025-09-15-noon
                  processYear: '26'
      responses:
        '201':
          description: Run created and queued or already running asynchronously.
          headers:
            Location:
              description: URI of the created run resource.
              schema:
                type: string
                example: /api/assessed-value-preparation-runs/841732905
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessedValuePreparationRunResponse'
              examples:
                queued:
                  value:
                    id: 841732905
                    status: QUEUED
                    businessDate: 2025-09-15
                    businessTime: 12:00:00
                    processYear: '26'
                    outputs: []
                    messages: []
        '400':
          description: The run request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessedValuePreparationErrorResponse'
              examples:
                invalidProcessYear:
                  value:
                    error: INVALID_PROCESS_YEAR
                    message: processYear must contain exactly two decimal digits.
                    ruleId: asrea178-001
        '409':
          description: The idempotency key is already associated with a different assessed-value preparation request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessedValuePreparationErrorResponse'
              examples:
                idempotencyConflict:
                  value:
                    error: IDEMPOTENCY_CONFLICT
                    message: The idempotencyKey is already associated with different request parameters.
  /api/assessed-value-preparation-runs/{id}:
    get:
      tags:
      - Assessed Value Preparation Runs
      summary: Read an assessed value preparation run
      operationId: getAssessedValuePreparationRun
      description: |
        Returns operational status and the latest observable batch result. This
        endpoint does not define business decisions; all business rules attach to
        `POST /api/assessed-value-preparation-runs`. When processing has ended,
        this response is where callers observe the final return code, record
        counts, output artifacts, stage results, partial-output flag, and
        rule-addressed messages.
      parameters:
      - name: id
        in: path
        required: true
        description: Positive run identifier returned when the run was created.
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 841732905
      responses:
        '200':
          description: Current status and result of the run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessedValuePreparationRunResponse'
              examples:
                completed:
                  value:
                    id: 841732905
                    status: COMPLETED
                    businessDate: 2025-09-15
                    businessTime: 12:00:00
                    processYear: '26'
                    returnCode: 0
                    recordsRead: 30
                    recordsWritten: 30
                    recordsUpdated: 10
                    recordsRejected: 0
                    partialOutput: false
                    outputs:
                    - artifactId: avpout_01K5A8C2V7M4R9N6T3Q0W1X8YZ
                      kind: OVERALL_CLASS_REPORT
                      mediaType: text/plain
                      recordCount: 14
                      partial: false
                    - artifactId: avpout_01K5A8D4B2H7P9S6F3J0L1M5NC
                      kind: VALUATION_BREAKDOWN_REPORT
                      mediaType: text/plain
                      recordCount: 17
                      partial: false
                    - artifactId: avpout_01K5A8F6D3N9R2T7V4X0Z1B8GH
                      kind: ASSESSMENT_MASTER
                      mediaType: application/octet-stream
                      recordCount: 10
                      partial: false
                    messages: []
                    stages:
                    - stage: OVERALL_CLASS
                      status: COMPLETED
                      returnCode: 0
                      recordsRead: 10
                      recordsWritten: 10
                      recordsUpdated: 10
                      recordsRejected: 0
                      outputPublished: true
                      partialOutput: false
                    - stage: VALUATION_BUCKETING
                      status: COMPLETED
                      returnCode: 0
                      recordsRead: 10
                      recordsWritten: 10
                      recordsUpdated: 10
                      recordsRejected: 0
                      outputPublished: true
                      partialOutput: false
                    - stage: TYPE5_CONVERSION
                      status: COMPLETED
                      returnCode: 0
                      recordsRead: 10
                      recordsWritten: 10
                      recordsUpdated: 0
                      recordsRejected: 0
                      outputPublished: true
                      partialOutput: false
        '404':
          description: No run exists for the supplied identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessedValuePreparationErrorResponse'
              examples:
                runNotFound:
                  value:
                    error: RUN_NOT_FOUND
                    message: No assessed-value preparation run exists for the supplied id.
  /api/tax-rate-input-preparation-runs:
    post:
      tags:
      - TaxRateInputPreparationRuns
      summary: Start a tax-rate input preparation run
      description: |
        Creates an asynchronous run against the server's preloaded shared data.
        The response describes the accepted run resource; poll the GET endpoint
        for status, reconciliation counts, messages, outputs, and the final return
        code. Idempotency applies to this start request, not to an isolated copy of
        mutable batch data.
      operationId: startTaxRateInputPreparationRun
      x-business-rules:
      - id: clrtm751-001
        summary: Equalized-value input is nondecreasing and division input is strictly increasing by volume and property; violations set return code 16.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes FAILED status, returnCode, and rule-linked messages.
      - id: clrtm751-002
        summary: A matching division-master row stamps its division number while preserving other equalized-value fields.
      - id: clrtm751-003
        summary: An unmatched parcel uses its property number as division number, subject to the unchecked 15-to-14 digit narrowing boundary.
      - id: clrtm751-004
        summary: Division stamping reports read, written, stamped, and unmatched counts; the legacy unmatched-division counter remains zero because it is never incremented.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes divisionStamping reconciliation counts.
      - id: clrtm752-001
        summary: Divided equalized-value input is strictly increasing by town, volume, property, and tax type, with an unchecked 15-to-14 digit property-key narrowing boundary.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes FAILED status, returnCode, and rule-linked messages.
      - id: clrtm752-002
        summary: A matched tax code carries its existing composite rate and all 40 agency slots into the parcel assessment record; no rate is calculated.
      - id: clrtm752-003
        summary: A missing tax code increments the unmatched count, emits a report message, writes no agency-assessment record for that parcel, and does not fail the run.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes assessmentRecordsUnmatched, zero-or-more agency-assessment output records, and rule-linked messages.
      - id: clrtm752-004
        summary: Attachment reconciliation reports assessment records read, written, and unmatched; written plus unmatched equals read only on normal non-error processing.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes agencyAttachment reconciliation, including retained partial output.
      - id: clrtm753-001
        summary: Prior- and current-year masters are nondecreasing by division; a descending record sets return code 16 but an active group can still produce partial output.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes FAILED status, returnCode, counts, and retained outputs.
      - id: clrtm753-002
        summary: A matched division totals each year's EAV and deduplicates nonzero agencies into separate 40-entry tables, silently dropping additional unique agencies.
      - id: clrtm753-003
        summary: Prior-only agencies become D segments, current-only agencies become A segments, and unchanged agencies produce no segment.
      - id: clrtm753-004
        summary: A division present in only one year is reported and skipped without producing a comparison record for that occurrence.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes priorOnlyDivisions, currentOnlyDivisions, and rule-linked messages.
      - id: clrtm753-005
        summary: Every matched division carries 100.0 percent because the ratio calculation is inactive; this is a known legacy defect, not an approved proportional allocation formula.
      - id: clrtm753-006
        summary: Each matched division attempts one comparison record, including zero-segment records; the 50-segment output capacity is unguarded despite an 80-segment theoretical difference.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes comparison records and segment counts, including retained partial output.
      - id: clrtm755-001
        summary: D segments load the disconnect table, A segments load the annex table, unknown types load neither, and the declared input contains at most 50 total segments.
      - id: clrtm755-002
        summary: Disconnects match prior-year parcels and annexations match current-year parcels, but only classified slots 1 through 40 are searched and duplicate parcel slots post repeatedly.
      - id: clrtm755-003
        summary: Each posting is source parcel EAV times percentage divided by 100 and rounded to an integer; the current 100.0 field posts the full parcel EAV.
      - id: clrtm755-004
        summary: An existing frozen-agency key accumulates disconnected or annexed EAV and is rewritten; later failure does not roll back earlier mutations.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes rewriteOperations, partial outputs, and final returnCode.
      - id: clrtm755-005
        summary: A missing frozen-agency key is inserted with the selected EAV and listed fields zeroed, while FA-EXPINCTX remains unspecified and prior mutations are not rolled back.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes insertOperations, partial outputs, and final returnCode.
      - id: clrtm755-006
        summary: Prior- and current-year posting inputs are nondecreasing by division; descending input sets return code 16 but active nested loops may continue.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes FAILED status, partial operation counts, and retained outputs.
      - id: clrtm755-007
        summary: The posting report lists each posted value and operation totals; rewrite and insert totals count operations rather than unique keys and remain visible after partial failure.
        observedThrough: GET /api/tax-rate-input-preparation-runs/{id} exposes frozenAgencyPosting reconciliation and report output metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxRateInputPreparationRunRequest'
            example:
              businessDate: 2025-09-15
              businessTime: 12:00:00
              idempotencyKey: clerk-agency-attachment-20250915-120000
      responses:
        '201':
          description: Run accepted and queued.
          headers:
            Location:
              description: URI of the asynchronous run resource.
              required: true
              schema:
                type: string
                example: /api/tax-rate-input-preparation-runs/900719925474099
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRateInputPreparationRunResponse'
              example:
                id: 900719925474099
                status: QUEUED
                businessDate: 2025-09-15
                businessTime: 12:00:00
                outputs: []
                messages: []
        '400':
          description: The start request is malformed or incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRateInputPreparationErrorResponse'
              example:
                error: INVALID_REQUEST
                message: businessDate is required
        '409':
          description: The idempotency key was already used with different request values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRateInputPreparationErrorResponse'
              example:
                error: IDEMPOTENCY_CONFLICT
                message: The idempotency key already identifies a run with different request values
  /api/tax-rate-input-preparation-runs/{id}:
    get:
      tags:
      - TaxRateInputPreparationRuns
      summary: Get a tax-rate input preparation run
      description: |
        Returns operational status and, as processing advances, the run's counts,
        outputs, messages, and final return code. Business rules are defined by the
        POST operation; this operation only observes their outcome.
      operationId: getTaxRateInputPreparationRun
      parameters:
      - name: id
        in: path
        required: true
        description: Positive server-generated surrogate run identifier.
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Current run state and any available result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRateInputPreparationRunResponse'
              examples:
                reviewedUnmatchedTaxCodes:
                  summary: Reviewed evidence; error-path reconciliation, not positive-path parity
                  value:
                    id: 900719925474099
                    status: COMPLETED
                    businessDate: 2025-09-15
                    businessTime: 12:00:00
                    returnCode: 0
                    recordsRead: 30
                    recordsWritten: 10
                    recordsUpdated: 10
                    recordsRejected: 10
                    outputs:
                    - name: agencyAssessment
                      kind: AGENCY_ASSESSMENT
                      recordCount: 0
                      available: true
                    - name: attachmentReport
                      kind: REPORT
                      recordCount: 19
                      available: true
                    messages:
                    - severity: WARNING
                      code: UNMATCHED_TAX_CODE
                      text: Ten assessment records had no matching tax-code master record; no agency-assessment records were produced.
                      ruleId: clrtm752-003
                    reconciliation:
                      divisionStamping:
                        equalizedValueRecordsRead: 10
                        divisionRecordsRead: 10
                        outputRecordsWritten: 10
                        recordsStamped: 10
                        divisionRecordsUnmatched: 0
                      agencyAttachment:
                        assessmentRecordsRead: 10
                        assessmentRecordsWritten: 0
                        assessmentRecordsUnmatched: 10
                        normalCompletionBalanced: true
        '404':
          description: No run exists for the supplied surrogate identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRateInputPreparationErrorResponse'
              example:
                error: RUN_NOT_FOUND
                message: No run exists for the supplied identifier
  /api/property-tax-exemptions-runs:
    post:
      tags:
      - PropertyTaxExemptionsRuns
      summary: Start a property-tax-exemptions batch run
      description: Creates one asynchronous run against preloaded shared live data. homeownerProcessingVariant ENUMERATED executes the reviewed HOME852 batch, and BROAD executes the reviewed HOME853 batch. The rejected ASHMA850 direct-update path and the unreviewed Senior Freeze paths are not executable through this endpoint and are not selected server-side. Their entries in x-business-rules preserve attached source-rule coverage only; attachment does not claim that those source programs execute. Business-rule failures, record rejections, warnings, partial application, reconciliation counts, logical publications, and return codes are recorded on the run and observed with GET.
      operationId: startPropertyTaxExemptionsRun
      x-business-rules:
      - id: ashma825-001
        summary: Homeowner and Senior Homestead application records are matched in ascending town, volume, property, and tax-type key order; an application below the homeowner key is reported as unmatched, an equal key produces a combined Senior Freeze load record, and a homeowner below the application key advances without consuming the application
      - id: ashma825-002
        summary: A Senior Freeze load record may contain at most 410 variable applicant details; attempting to append detail 411 sets return code 16 and stops processing
      - id: ashma825-003
        summary: Both sequential inputs are expected in nondecreasing match-key order, but the observed Senior Homestead reader updates the homeowner previous-key field instead of the homestead previous-key field, so its intended ordering rejection is not reliable
      - id: ashma825-004
        summary: Each matched applicant detail carries birth date, name, address, locality, application year, and batch, while the nine-digit application ZIP code is reduced to its first five digits in the Senior Freeze load record
      - id: ashma827-001
        summary: The IMS load requires a control card beginning CICV with a numeric checkpoint interval, followed by YEAR and a numeric processing year
      - id: ashma827-002
        summary: Senior Freeze load records must be nondecreasing by town, volume, property, tax type, and record code; a decreasing key stops the load with return code 16
      - id: ashma827-003
        summary: For an existing Senior Freeze master with the same record code, applicant fields are refreshed and the master is replaced; for a different record code, the existing master is deleted and a replacement master and details are inserted; when no master exists, a master and its details are inserted
      - id: ashma827-004
        summary: Fixed and variable Senior Freeze details use distinct keys, defaults, and the observed birth-century pivot
      - id: ashma827-005
        summary: Checkpoint eligibility is evaluated when the IMS-operation counter exceeds the supplied interval; record code 2 forces the counter to 999 before evaluation, and a checkpoint failure issues ROLL and stops processing
      - id: ashma840-001
        summary: The prior-year roll-forward requires CICV, a numeric checkpoint interval, PROCYEAR, and a numeric processing year, and rejects a driver extract whose key decreases
      - id: ashma840-002
        summary: A prior-year record is selected when its detail is qualified or its base-year indicator is 1; selected master base-year, class, building-unit, building-share, and valuation fields replace the current-year master values, and master Senior Freeze shares are reset to zero
      - id: ashma840-003
        summary: For each selected prior-year applicant, an existing current-year detail receives the prior base year, base-year indicator 1, and base-year EAV; a missing detail is inserted from the prior segment with those values and application-maintenance fields cleared
      - id: ashma840-004
        summary: Master replacement contributes one checkpoint unit, detail insertion contributes three, and detail replacement contributes four; a checkpoint is requested only after the counter exceeds the configured interval, and failure terminates through ROLL
      - id: ashma845-001
        summary: The share aggregation requires CICV, a numeric checkpoint interval, PROCYEAR, and a numeric processing year, and rejects a driver extract whose key decreases
      - id: ashma845-002
        summary: Only qualified prior-year details contribute cooperative Senior Freeze shares; shares reset to zero at the first record for a property and then accumulate for subsequent adjacent records with the same property number
      - id: ashma845-003
        summary: When accumulated Senior Freeze shares exceed building shares, the oversized total is still written and a nonfatal error report is produced; as observed, the comparison runs only on repeated-property records and omits a property represented by a single qualified record
      - id: ashma845-004
        summary: Each successful master replacement contributes two checkpoint units; checkpoint is attempted only after the counter exceeds the interval, and failure issues ROLL and stops processing
      - id: ashma850-001
        summary: ASHMA850 is a direct IMS-updating variant of the Senior Freeze base-value calculation, not a sequential step before ASHMA857; it independently reads current, prior, and expired assessments and applies the same broad calculation family before replacing the IMS master
      - id: ashma850-002
        summary: The calculation run requires CICV with a nonzero numeric interval, a nonzero numeric processing year and equalization factor, and numeric ascending ordinary-year and base-year windows
      - id: ashma850-003
        summary: Current and prior assessments are matched by parcel key and classified through the source calc-type table using residential improvement, residential land, farm land, mixed use, Class 288 improvement, and nonresidential components; an unaccounted or mixed cooperative class prevents calculation
      - id: ashma850-004
        summary: When a stored base year lies within the configured base-year window and its stored total eligible comparison EAV is nonzero, that stored base value is reused; otherwise base eligible AV is equalized by the factor keyed to the base year, while expired Class 288 and current-year values use the control-card factor
      - id: ashma850-005
        summary: Non-cooperative differences clamp at zero, while cooperative differences require positive applicant gains and a nonzero share denominator
      - id: ashma850-006
        summary: Successful direct master replacements contribute two units toward a checkpoint, which is issued only after the counter exceeds the configured interval; the program emits four calculation and exception reports plus run totals
      - id: ashma857-001
        summary: 'ASHMA857 is the read-only calculation and staging variant of ASHMA850: it reads IMS with GU and GNP, performs no IMS replacement, and writes one ASHMASFR01 Senior Freeze staging record for downstream ASHMA859 processing'
      - id: ashma857-002
        summary: The staging run requires CICV with a nonzero numeric interval, nonzero numeric prior and current processing years, a nonzero numeric equalization factor, and numeric ascending ordinary-year and base-year windows
      - id: ashma857-003
        summary: Current and prior assessments are matched by parcel key and classified through calc types A through R using residential improvement, residential land, farm land, mixed use, Class 288 improvement, and nonresidential components; unaccounted or mixed cooperative classes are staged as no-calculation outcomes
      - id: ashma857-004
        summary: When a stored base year lies within the configured window and stored total eligible comparison EAV is nonzero, the staging result reuses that stored base value; otherwise it reads the base-year equalization factor, and it separately uses the control-card factor for expired Class 288 and current-year values
      - id: ashma857-005
        summary: The non-cooperative final eligible-EAV difference is clamped at zero; cooperative results sum only positive qualified-applicant differences using cooperative Senior Freeze shares divided by building shares, and a zero building-share denominator marks the record no-calculation
      - id: ashma857-006
        summary: Each staging record carries parcel, year, record-code, base/current valuation, Class 288, no-calculation, manual-calculation, cooperative-share, applicant, and final-difference fields in the ASHMASFR01 handoff, and the run produces four reports and totals
      - id: ashma859-001
        summary: The staged commit requires CICV with a nonzero numeric interval, a nonzero numeric processing year and equalization factor, and type C or L; any invalid control stops before staging input is processed
      - id: ashma859-002
        summary: ASHMASFR01 staging records must be nondecreasing by town, volume, and property; a decreasing key sets the error switch and stops the commit run
      - id: ashma859-003
        summary: A staged property is eligible for consideration only when at least one live detail is qualified, the staging record is calculable, and its staged total eligible comparison EAV is lower than the stored master value; equal or higher values do not update the master
      - id: ashma859-004
        summary: Type C recomputes pending totals and cooperative applicant differences from the staged value and live master/detail state, while type L copies staged base fields directly into the held update; these are alternate modes, not successive steps
      - id: ashma859-005
        summary: A live master marked with manual calculation indicator X is not automatically replaced even after a lower staged value is selected
      - id: ashma859-006
        summary: Pending updates are committed once per completed property group by rereading the master through the update PCB, preserving original values in audit fields, replacing the selected base and final-difference fields, and writing an update report
      - id: ashma859-007
        summary: The commit invokes XRST at startup, issues an initial checkpoint, and thereafter checkpoints only when successful replacements make the counter exceed the supplied interval; checkpoint failure issues ROLL and stops the run
      - id: asrea841-001
