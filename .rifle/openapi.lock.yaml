    EifdTifIncrementRunRequest:
      type: object
      additionalProperties: false
      required:
      - businessDate
      - businessTime
      - idempotencyKey
      - reassessmentControl
      - processingYear
      - reportingYear
      - annualEqualizationFactor
      properties:
        businessDate:
          type: string
          format: date
          description: Pinned business date applied to every program in the run.
          example: 2025-09-15
        businessTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
          description: Pinned 24-hour business time applied to every program in the run.
          example: 12:00:00
        idempotencyKey:
          type: string
          minLength: 1
          description: Caller-selected key for deduplicating equivalent launch attempts.
        reassessmentControl:
          type: string
          minLength: 12
          maxLength: 12
          pattern: ^[0-9]{12}$
          description: |
            Complete ASREA740 reassessment control containing the current year,
            improvement-age range, and Class 288 year range. The service enforces
            ascending ranges and the century pivot in asrea740-002.
          example: '260181202526'
        processingYear:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[0-9]{2}$
          description: Two-digit ASREA742 processing year used for Class 288 selection.
          example: '26'
        reportingYear:
          type: string
          minLength: 4
          maxLength: 4
          pattern: ^[0-9]{4}$
          description: Four-digit reporting year used by the agency summary and town-within-agency report.
          example: '2026'
        annualEqualizationFactor:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^[0-9]{5}$
          description: Five-character positive factor with one integer and four fractional digits; 00000 is rejected by asrea748-001.
          example: '10000'
    EifdTifIncrementRunResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - businessDate
      - businessTime
      - outputs
      - messages
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Positive 64-bit surrogate run identifier.
          example: 9000000000000001
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - FAILED
        businessDate:
          type: string
          format: date
          description: Business date pinned by the launch request.
        businessTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
          description: Business time pinned by the launch request.
        returnCode:
          type: integer
          minimum: 0
          description: Final maximum batch return code; omitted before the run is terminal.
        recordsRead:
          type: integer
          minimum: 0
          description: Aggregate records read across completed steps; omitted until available.
        recordsWritten:
          type: integer
          minimum: 0
          description: Aggregate records written across completed steps; omitted until available.
        recordsUpdated:
          type: integer
          minimum: 0
          description: Aggregate shared-live records updated across completed steps; omitted until available.
        recordsRejected:
          type: integer
          minimum: 0
          description: Aggregate records rejected or omitted by a reported rule path; omitted until available.
        outputs:
          type: array
          description: Logical batch products and reports; items never expose server filesystem paths.
          items:
            $ref: '#/components/schemas/EifdTifIncrementOutput'
        messages:
          type: array
          description: Operational and business-rule messages observed so far.
          items:
            $ref: '#/components/schemas/EifdTifIncrementMessage'
    EifdTifIncrementOutput:
      type: object
      additionalProperties: false
      required:
      - name
      - recordCount
      properties:
        name:
          type: string
          description: Stable logical product name, such as agencySummaryReport; never a local path.
        recordCount:
          type: integer
          minimum: 0
        generation:
          type: integer
          minimum: 1
          description: Shared-live logical generation when the product is versioned.
    EifdTifIncrementMessage:
      type: object
