spring:
  application:
    name: cook-county-tax-rate-making
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  batch:
    max-concurrent-runs: ${BATCH_MAX_CONCURRENT_RUNS:4}
    # Keep this longer than the longest expected JVM or database pause. All application hosts
    # must synchronize UTC clocks. Drain pre-V23 instances before the V23 migration starts.
    run-lease: ${BATCH_RUN_LEASE:5m}
  web:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  port: ${SERVER_PORT:8080}
